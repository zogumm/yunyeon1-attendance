<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>출석 음성 들어보기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@600;800;900&display=swap">
<style>
:root{--panel:#F7F1E6;--ink:#141414;--sub:#6B6355;--mut:#9A9284;--yl:#FFD83D;--or:#FF6B2C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans KR",sans-serif;background:var(--panel);color:var(--ink);padding:24px 20px 40px;max-width:560px;margin:0 auto;word-break:keep-all}
h1{font-size:24px;font-weight:900;letter-spacing:-.6px}
p.s{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.6}
label{display:block;font-size:12px;font-weight:900;color:var(--sub);margin:20px 0 8px}
select,input{width:100%;font:inherit;font-size:16px;font-weight:700;padding:12px 14px;border-radius:16px;border:1.5px solid rgba(107,99,85,.2);background:#fff}
.row{display:flex;gap:10px;margin-top:10px}.row>div{flex:1}
.list{margin-top:20px;display:flex;flex-direction:column;gap:10px}
button.say{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:0;border-radius:18px;padding:14px 16px;font:inherit}
button.say b{width:36px;height:36px;border-radius:50%;background:var(--yl);display:grid;place-items:center;flex:none;font-size:15px}
button.say span{font-size:16px;font-weight:800}
button.say small{display:block;font-size:12px;color:var(--mut);font-weight:700}
.tip{margin-top:24px;background:#fff;border-radius:18px;padding:14px 16px;font-size:13px;line-height:1.7;color:var(--sub)}
.tip b{color:var(--ink)}
</style></head><body>
<h1>출석 음성 들어보기</h1>
<p class="s">아이패드 출석에서 나오는 말이에요. 눌러서 들어 보세요. (이 폰에 깔린 목소리로 나와요)</p>
<label>목소리</label><select id="voice"></select>
<div class="row"><div><label>빠르기 <span id="rv">1.05</span></label><input id="rate" type="range" min="0.7" max="1.4" step="0.05" value="1.05"></div>
<div><label>높낮이 <span id="pv">1</span></label><input id="pitch" type="range" min="0.6" max="1.6" step="0.1" value="1"></div></div>
<label>아이 이름 (6·7번에 들어가요)</label><input id="nm" value="김하늘">
<div class="list" id="list"></div>
<div class="tip"><b>더 자연스러운 목소리 받기(무료)</b><br>아이패드 <b>설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성 → 한국어</b>에서 <b>유나(향상됨)</b> 같은 목소리를 내려받은 뒤 이 페이지를 다시 열면 위 목록에 나와요.</div>
<script>
var LINES=[['출석을 준비하고 있어요','출석 시작을 눌렀을 때'],['얼굴을 원 안에 맞춰 주세요','얼굴이 원 밖에 있을 때'],['다시 한번 얼굴을 맞춰 주세요','누군지 애매할 때'],['QR코드를 카메라 앞에 보여 주세요','계속 애매할 때'],['등록되지 않은 QR코드예요','명단에 없는 QR'],['{n} 확인되었습니다','출석 성공'],['{n}, 이미 출석했어요','이미 출석한 아이']];
var ss=window.speechSynthesis,sel=document.getElementById('voice'),voices=[];
function fill(){voices=ss?ss.getVoices().filter(function(v){return /^ko/i.test(v.lang)}):[];
 sel.innerHTML='';if(!voices.length){var o=document.createElement('option');o.textContent='한국어 목소리 없음(기본)';sel.appendChild(o);return}
 voices.sort(function(a,b){return /향상|고급|enhanced|premium/i.test(b.name)-/향상|고급|enhanced|premium/i.test(a.name)});
 voices.forEach(function(v,i){var o=document.createElement('option');o.value=i;o.textContent=v.name+(v.localService?'':' (온라인)');sel.appendChild(o)})}
fill();if(ss)ss.onvoiceschanged=fill;
['rate','pitch'].forEach(function(k){document.getElementById(k).oninput=function(){document.getElementById(k==='rate'?'rv':'pv').textContent=this.value}});
var box=document.getElementById('list');
LINES.forEach(function(l,i){var b=document.createElement('button');b.className='say';
 b.innerHTML='<b>'+(i+1)+'</b><div><span></span><small></small></div>';
 b.querySelector('small').textContent=l[1];
 function txt(){return l[0].replace('{n}',document.getElementById('nm').value||'김하늘')}
 b.querySelector('span').textContent=txt();
 document.getElementById('nm').addEventListener('input',function(){b.querySelector('span').textContent=txt()});
 b.onclick=function(){if(!ss)return alert('이 브라우저는 음성을 지원하지 않아요');ss.cancel();
  var u=new SpeechSynthesisUtterance(txt());u.lang='ko-KR';u.rate=+document.getElementById('rate').value;u.pitch=+document.getElementById('pitch').value;
  var v=voices[+sel.value];if(v)u.voice=v;ss.speak(u)};
 box.appendChild(b)});
</script></body></html>
